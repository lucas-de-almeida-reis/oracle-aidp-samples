# =====================================================================
#  Iceberg external table sync: AIDP -> Oracle Autonomous Database
#  Deployment configuration: adw_sync.yaml
#
#  WORKED EXAMPLE. adw_sync.sample.yaml is the commented template that documents
#  every key; this file is one concrete combination of them, ready to edit:
#
#    - the service account comes from ONE JSON credential (oci_credential_secret)
#      rather than four single-value ones, with the tenancy OCID alongside it;
#    - each ADW is driven by its OWN database user, not ADMIN (adw_user as a map);
#    - registry_table is unqualified, so each ADW keeps its state in that user's
#      own schema and the job needs no ANY TABLE privilege;
#    - mTLS is off (flags.use_wallet: false), so each ADW needs 2 secrets, not 4.
#
#  Replace every CHANGE_ME_ value, and the demo_ prefixes with your own.
#
#  Holds NO secret - only names, region and tuning knobs. Every secret
#  lives in OCI Vault and is read through the AIDP Credential Store.
#  Safe to version and share.
#
#  The only per-run input is CATALOG, passed as a job parameter.
#
#  The file name matters. The notebook locates this file without assuming
#  any path, and 'adw_sync.yaml' is a distinctive name: found on its own
#  under /Workspace it already resolves, even if the notebook is renamed
#  or the folder moved. A generic 'config.yaml' is only accepted when it
#  sits next to the notebook, because a real workspace usually holds
#  several files with that name, belonging to other projects.
# =====================================================================

# Region of the OBJECT STORAGE / lakehouse - NOT the ADWs.
# Each ADW carries its own host in the DSN, so a multi-region fleet works unchanged.
region: us-ashburn-1

# --- OCI service account ---
# ONE credential holding a JSON document with the whole identity:
#   {"user_id": "...", "api_key": {"fingerprint": "...", "private_pem": "..."}}
# Extra fields (user_name, created_at, public_pem, customer_secret_key) are ignored.
#
# The value below is the credential name USED VERBATIM. Nothing is prefixed,
# suffixed or otherwise derived from it, so whatever name your provisioning
# emits goes here unchanged - no naming convention is imposed.
#
# >>> Put the exact name as registered in the AIDP Credential Store. <<<
oci_credential_secret: CHANGE_ME_exact_credential_name

# Required with oci_credential_secret: the JSON document has no tenancy field.
# An identifier, not a secret - it appears in every OCI Console URL.
#
# >>> Set this to your tenancy OCID. <<<
oci_tenancy_id: CHANGE_ME_ocid1.tenancy.oc1..xxxx

# The four-single-value alternative. Leave commented: setting both is rejected.
# oci_credential_prefix: demo_oci

# --- ADW fleet ---
# One prefix per ADW. Each expects:
#   <prefix>_dsn  <prefix>_pwd                      always
#   <prefix>_wallet_zip  <prefix>_wallet_pwd        only when flags.use_wallet is true
#
# _wallet_zip accepts 'oci://<bucket>@<namespace>/<object>' - preferred, because
# provisioning becomes a CLI or Terraform call - or an AIDP Volume path.
#
# The ADW name in the logs is the prefix itself.
adw_prefixes:
  - demo_adw1
  - demo_adw2

# Administrative user. Two shapes:
#
#   adw_user: ADMIN          a single value, used on every ADW
#
#   adw_user:                per ADW, keyed by the prefix. Prefixes not listed fall
#     demo_adw1: SYNC_ADMIN    back to ADMIN; an unknown key is rejected, because a typo
#     demo_adw2: ADMIN         would otherwise silently connect as the wrong user.
#
# A positional list is refused: it rebinds users to the wrong ADWs as soon as
# adw_prefixes is reordered, and nothing in the run would show it.
#
# This lives HERE and not in the Vault: it is configuration, not a secret.
#
# ADMIN is the recommended default. A dedicated user buys credential separation and
# cleaner audit, NOT less privilege: this job needs CREATE USER and ALTER USER, and
# ALTER USER reaches every account including ADMIN. If you do create one, PDB_DBA plus
# two grants is the recipe - see the README, "Using a dedicated user instead of ADMIN".
# One entry per ADW, keyed by the prefix above. Keys must match adw_prefixes exactly -
# an unknown key is rejected rather than falling back silently.
#
# >>> Set these to the users you created on each ADW. <<<
adw_user:
  demo_adw1: CHANGE_ME_SYNC_ADMIN_1
  demo_adw2: CHANGE_ME_SYNC_ADMIN_2

# --- Naming ---
naming:
  # The SCHEMA prefix is not listed here: it is always <catalog>_ , derived and not
  # configurable. It is what stops two catalogs holding a same-named schema and table
  # from writing to the same ADW object; leaving it as a knob would only allow the
  # protection to be switched off.
  table_prefix: ""
  cred_name: null        # null = OCI_CRED_<CATALOG>
  raw_suffix: "__RAW"

# --- Behaviour ---
flags:
  create_views: false     # true = <T>__RAW plus view <T>
  preserve_grants: true   # recapture and reapply grants on recreate
  # Realigns tables whose tip snapshot references a schema older than current-schema-id,
  # which matters for consumers that resolve the table shape through the snapshot.
  # Writes to the SOURCE lakehouse and waits for asynchronous metadata regeneration - several
  # seconds per table - so it can dominate the run time. Recommended OFF; enable per run.
  force_snapshot: false
  retry_failed: true      # one retry before writing the registry
  bulk_discovery: true    # bulk listing through the Object Storage SDK
  # mTLS wallet, fleet-wide. Set false ONLY when every ADB has mutual TLS set to NOT
  # required; each <prefix>_dsn must then be the TLS connection string from the console,
  # not the mTLS descriptor. With false, the two wallet secrets are not read at all -
  # 4 credentials per ADW become 2 - and the wallet bucket becomes unnecessary.
  use_wallet: false

# --- Parallelism ---
# Connections per run = min(fleet size, adw_workers_cap) x workers
parallelism:
  workers: 8
  adw_workers_cap: 4
  intra_schema_workers: 1
  introspect_workers: 8
  discovery_workers: 8
  read_workers: 32

# --- Discovery ---
discovery:
  fallback_max_per_schema: 20
  list_page: 1000
  exclude_schemas:
    - information_schema
    - default_schema
    - default

# --- Infrastructure ---
# Sync state, one row per (catalog, owner, table). Created and written by the ADMINISTRATIVE
# connection, so the schema qualifier decides which privileges that user needs:
#   ADMIN.EXT_REGISTRY_V4   needs CREATE ANY TABLE plus SELECT/INSERT/UPDATE/DELETE ANY
#                           TABLE when adw_user is not ADMIN. A PDB_DBA user does carry
#                           these (verified on ADB 23ai), so this works - it just relies on
#                           privileges the job does not otherwise need.
#   EXT_REGISTRY_V4         unqualified - resolves to each ADW's own adw_user schema. Prefer
#                           this for any non-ADMIN user: no ANY TABLE privileges required,
#                           and a fleet with different users per ADW keeps state separated.
# Unqualified: resolves to each ADW's own adw_user schema, so the fleet keeps its state
# separated and the job needs no ANY TABLE privilege.
registry_table: EXT_REGISTRY_V4
acl_privileges:
  - connect
vault_key: VaultSecretReference

progress:
  every_n: 100
  every_pct: 5

# CATALOG fallback for INTERACTIVE TESTING, when no job parameter exists.
# Leave null in production: the banner warns loudly if this value is used.
catalog: scale_test
